services:
  - type: web
    name: career-match-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SCAN_TIMEZONE
        value: Asia/Kolkata
      - key: MATCH_HIGH
        value: "75"
      - key: MATCH_MEDIUM
        value: "55"
      - key: MAX_JOB_AGE_DAYS
        value: "14"
